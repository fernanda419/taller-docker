<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; background: #FAFBF9; color: #333A35;
           max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #33503E; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; border: 1px solid #CBD8CD; border-radius: 6px; }
    button { padding: 10px 14px; border: none; border-radius: 6px;
             background: #5A8467; color: #fff; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px;
         background: #F0F3EF; border-radius: 6px; margin-bottom: 8px; }
    li span { flex: 1; }
    li.hecha span { text-decoration: line-through; color: #6E766F; }
    .eliminar { background: #8C5A4E; }
    #estado { color: #6E766F; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Gestor de tareas</h1>
  <form id="formulario">
    <input id="titulo" placeholder="Nueva tarea" required>
    <button type="submit">Agregar</button>
  </form>
  <p id="estado"></p>
  <ul id="lista"></ul>

  <script>
    const lista = document.getElementById("lista");
    const estado = document.getElementById("estado");

    async function cargar() {
      try {
        const respuesta = await fetch("/api/tareas");
        const tareas = await respuesta.json();
        lista.innerHTML = "";
        tareas.forEach(t => {
          const item = document.createElement("li");
          if (t.completada) item.classList.add("hecha");
          const texto = document.createElement("span");
          texto.textContent = t.titulo;
          const marcar = document.createElement("button");
          marcar.textContent = t.completada ? "Reabrir" : "Completar";
          marcar.onclick = () => accion("PUT", t.id);
          const borrar = document.createElement("button");
          borrar.textContent = "Eliminar";
          borrar.className = "eliminar";
          borrar.onclick = () => accion("DELETE", t.id);
          item.append(texto, marcar, borrar);
          lista.appendChild(item);
        });
        estado.textContent = tareas.length + " tarea(s) registradas";
      } catch (e) {
        estado.textContent = "No fue posible conectar con la API. Intente de nuevo en unos segundos.";
      }
    }

    async function accion(metodo, id) {
      await fetch("/api/tareas/" + id, { method: metodo });
      cargar();
    }

    document.getElementById("formulario").onsubmit = async (e) => {
      e.preventDefault();
      const campo = document.getElementById("titulo");
      await fetch("/api/tareas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titulo: campo.value })
      });
      campo.value = "";
      cargar();
    };

    cargar();
  </script>
</body>
</html>
